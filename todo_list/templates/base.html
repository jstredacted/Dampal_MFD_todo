<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-do list</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f3f5f7; color: #202d36; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .page { max-width: 760px; margin: 40px auto; padding: 32px; background: white; border: 1px solid #d4dce1; border-radius: 12px; }
        nav { display: flex; gap: 20px; margin-bottom: 24px; }
        a { color: #164d67; }
        h1 { margin: 0; font-size: 32px; }
        h2 { margin: 28px 0 12px; font-size: 20px; }
        .intro, footer { color: #51616c; }
        .intro { margin: 8px 0 24px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        .add-controls { display: flex; gap: 10px; }
        input { min-width: 0; flex: 1; padding: 11px 12px; border: 1px solid #8b9aa4; border-radius: 6px; font: inherit; }
        button { padding: 10px 14px; border: 1px solid #8b9aa4; border-radius: 6px; background: white; color: #164d67; font: inherit; cursor: pointer; }
        .primary { background: #164d67; border-color: #164d67; color: white; }
        .delete { color: #9f3025; border-color: #bc8c86; }
        button:hover { background: #edf2f5; }
        .primary:hover { background: #103b50; }
        a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #ba7000; outline-offset: 3px; }
        .tasks { padding: 0; margin: 0; list-style: none; }
        .task { display: flex; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 1px solid #d4dce1; }
        .task-content { flex: 1; min-width: 0; }
        .task-text { display: block; overflow-wrap: anywhere; }
        .completed .task-text { text-decoration: line-through; color: #51616c; }
        .task-status { display: block; color: #51616c; font-size: 13px; margin-top: 4px; }
        .task-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .empty-state { padding: 24px 0; color: #51616c; }
        .errorlist { color: #9f3025; padding-left: 20px; }
        footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid #d4dce1; font-size: 14px; }
        @media (max-width: 600px) {
            .page { margin: 16px; padding: 20px; }
            .add-controls { flex-direction: column; }
            .task { align-items: stretch; flex-direction: column; gap: 12px; }
            .task-actions form { flex: 1; }
            .task-actions button { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="page">
        <nav aria-label="Main navigation">
            <a href="{% url 'home' %}">Tasks</a>
            <a href="{% url 'about' %}">About</a>
        </nav>
        {% block content %}{% endblock %}
        <footer>This is a shared demo list. Anyone with the link can change its tasks.</footer>
    </main>
</body>
</html>

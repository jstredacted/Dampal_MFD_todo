{% extends 'base.html' %}

{% block content %}

<h1>Create a New Item</h1>

<form method="POST">

    <div class="mb-3">
        <label for="name" class="form-label">
            Item Name
        </label>

        <input type="text"
               class="form-control"
               id="name"
               name="name"
               maxlength="100"
               placeholder="Enter item name"
               required>
    </div>

    <button type="submit"
            class="btn btn-success">
        Create
    </button>

    <a href="{{ url_for('index') }}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}

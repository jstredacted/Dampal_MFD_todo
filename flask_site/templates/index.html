{% extends 'base.html' %}

{% block content %}

<h1>Items</h1>

<a href="{{ url_for('create') }}"
   class="btn btn-primary mb-3">
    Add New Item
</a>

<ul class="list-group">

    {% for item in items %}

    <li class="list-group-item d-flex justify-content-between align-items-center">

        <span>{{ item.name }}</span>

        <div class="d-flex gap-2">

            <a href="{{ url_for('update', idNum=item.idNum) }}"
               class="btn btn-warning btn-sm">
                Edit
            </a>

            <form method="POST"
                  action="{{ url_for('delete', idNum=item.idNum) }}"
                  onsubmit="return confirm('Delete this item?');">

                <button type="submit"
                        class="btn btn-danger btn-sm">
                    Delete
                </button>

            </form>

        </div>

    </li>

    {% else %}

    <li class="list-group-item">
        No items found.
    </li>

    {% endfor %}

</ul>

{% endblock %}
